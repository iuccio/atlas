<div [formGroup]="formGroup" class="d-flex flex-column">
  @if (displayLabel) {
    <atlas-label-field
      [fieldExamples]="[
        { label: subLabel, translate: true },
        { label: ' | ', translate: false },
        {
          label: 'FORM.MAX_CHARS',
          translate: true,
          arg: { key: 'numberOfChars', value: maxChars },
        },
      ]"
      [required]="required"
      fieldLabel="{{ label }}"
      infoIconTitle="{{ info }}"
    ></atlas-label-field>
  }
  <textarea
    [attr.data-cy]="controlName"
    formControlName="{{ controlName }}"
    matInput
    rows="7"
    [readonly]="readonly"
  ></textarea>
  @let ctrl = formGroup.get(controlName);
  <atlas-field-error
    [control]="ctrl"
    [ctrlErrors]="ctrl?.errors"
  ></atlas-field-error>
</div>
