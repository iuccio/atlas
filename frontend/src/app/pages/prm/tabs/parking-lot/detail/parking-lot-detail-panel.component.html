<atlas-detail-page-container>
  <div class="font-bold-4xl detail-title mb-3">
    {{ servicePoint.designationOfficial }} -
    {{ 'PRM.PARKING_LOTS.PARKING_LOT' | translate }}
    {{ isNew ? '' : selectedVersion.designation }}
  </div>
  <atlas-prm-detail-panel
    [isNew]="isNew"
    [selectedVersion]="selectedVersion"
    [maxValidity]="maxValidity"
  ></atlas-prm-detail-panel>

  <atlas-prm-detail-with-relation-tab
    [isNew]="isNew"
    [isReduced]="isReduced"
    detailTitle="PRM.TABS.PARKING_LOT"
  ></atlas-prm-detail-with-relation-tab>
</atlas-detail-page-container>
