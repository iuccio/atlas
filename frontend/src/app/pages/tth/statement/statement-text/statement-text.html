<ng-container [formGroup]="form()">
  <div class="flex-row mb-4">
    <app-atlas-label-field fieldLabel="TTH.STATEMENT.STATEMENT_TEXT" />
    <div class="d-flex flex-row col-12 mt-2 mb-2">
      <mat-checkbox
        formControlName="statementAnonymous"
        (change)="checkStatementAnonymous($event.checked)"
        data-cy="statementAnonymous"
      >
        {{ 'TTH.STATEMENT.STATEMENT_ANONYMOUS' | translate }}
      </mat-checkbox>
    </div>

    @if (showOriginalTextButton) {
    <atlas-button
      buttonDataCy="showOriginalStatementText"
      [buttonText]="originalTextButtonLabel"
      buttonType="icon"
      (buttonClicked)="showOriginalText()"
      wrapperStyleClass="pt-1"
      buttonStyleClass="atlas-icon-btn font-bold-base"
    >
      <ng-template #rightIcon>
        <i class="bi {{ originalTextButtonIcon }} h5"></i>
      </ng-template>
    </atlas-button>
    }
    @if (showOriginalStatementText) {
    <div class="pt-2 d-flex flex-column col-12">
      <form-comment
        [formGroup]="form()"
        [displayLabel]="false"
        controlName="statement"
        [readonly]="!this.isNew()"
      >
      </form-comment>
    </div>
    }
    @if (!isCheckboxStatementAnonymous) {
    <div class="mb-3 mt-3">
      @if (!isAnonymizeStatementButtonActive) {
      <atlas-button
        [disabled]="form().disabled"
        (click)="anonymizeStatement()"
        buttonDataCy="anonymizeStatementButton"
        buttonText="TTH.STATEMENT.ANONIMYZE_BUTTON"
        buttonType="whiteFooterNonEdit"
      >
        <ng-template #rightIcon>
          <i class="ps-1 bi bi-card-text h5"></i>
        </ng-template>
      </atlas-button>
      }
    </div>
      @if (isAnonymizeStatementButtonActive) {
    <div class="d-flex flex-column col-12">
      <form-comment
        [formGroup]="form()"
        [displayLabel]="true"
        label=""
        controlName="anonymousStatement"
      >
      </form-comment>
    </div>
    } }
  </div>
</ng-container>
