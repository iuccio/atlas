name: CI - Java + Node

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # change these values to the exact versions you want, e.g. '25' or '25-ea' or 'openjdk@25'
  JAVA_VERSION: '25'
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          # distribution can be 'temurin', 'temurin-jdk', 'zulu', etc. If JDK 25 is available on the action, set distribution accordingly.
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # Setup Node
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Show versions
        run: |
          java -version || true
          javac -version || true
          node -v
          npm -v
          pnpm -v || true
      
      
      - name: Install npm dependencies
        run: |
          npm cache clean --force
          npm install --prefix frontend/

      # Build Java: detect Maven or Gradle
      - name: Build Java
        run: |
          gradle build
